name: Probe curated servers

# Weekly: every server in the curated catalog must still answer /api/v2/instance as a
# Mastodon-API server. A dead entry fails this run — remove it (or rerun locally with
# `node scripts/probe-instances.mjs --write` to refresh software + verifiedAt).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node scripts/probe-instances.mjs
