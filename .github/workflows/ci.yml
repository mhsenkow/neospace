name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # check = functions typecheck + full app typecheck (vue-tsc) + vitest
      - run: npm run generate
      # eslint / a11y plugin / Playwright axe / Lighthouse CI still optional
