name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Actions are pinned to reviewed commit SHAs (tag in the trailing comment); Dependabot
# (.github/dependabot.yml) proposes bumps weekly so updates stay traceable PRs.
# Read-only token — CI only checks; a compromised dependency can't push or comment
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung install / generate can't hold a runner for the 6h default
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # check = functions typecheck + full app typecheck (vue-tsc) + vitest
      - run: npm run generate
      - name: Record checked commit
        run: |
          echo "CI_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Checked commit: $(git rev-parse HEAD)"

  e2e:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Desktop journeys (chromium) + mobile journeys (Chromium with a phone profile).
      # WebKit is opt-in locally (E2E_WEBKIT=1); CI needs only the Chromium install above.
      - name: Browser journeys + axe (desktop and mobile)
        run: npx playwright test --project=chromium --project=mobile
      # Report + traces, uploaded whenever the browser step failed (never on a missing-file no-op)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
