# Keep SHA-pinned GitHub Actions, digest-pinned Docker base images, and npm
# dependencies current: each bump is a reviewable PR
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fontsource:
        patterns:
          - '@fontsource/*'
      capacitor:
        patterns:
          - '@capacitor/*'
