server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Server-level headers are inherited only by locations that set no
    # add_header of their own — so cache lifetimes below use `expires`.
    # Mirrors public/_headers (Cloudflare Pages); keep the two in sync.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://github.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;

    location /api/feedback {
        default_type application/json;
        return 404 '{"error":"not_available"}';
    }

    # Content-hashed build output — safe to cache for a year
    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    # Everything else (index.html, sw.js, workbox, manifest, /boot/*.js, icons)
    # has a stable name, so it must revalidate or deploys go stale.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
